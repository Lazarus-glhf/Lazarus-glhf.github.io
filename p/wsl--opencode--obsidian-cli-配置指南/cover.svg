<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <radialGradient id="glowPurple" cx="25%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGreen" cx="82%" cy="72%" r="35%">
      <stop offset="0%" stop-color="#a6e3a1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#cba6f7"/>
      <stop offset="55%" stop-color="#89dceb"/>
      <stop offset="80%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blurXs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="canvas">
      <rect width="800" height="400"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="800" height="400" fill="url(#bg)"/>

    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cba6f7" opacity="0.18"/>
    </pattern>
    <rect width="800" height="400" fill="url(#dots)"/>

    <ellipse cx="170" cy="210" rx="260" ry="220" fill="url(#glowPurple)" filter="url(#blur)"/>
    <ellipse cx="670" cy="310" rx="190" ry="170" fill="url(#glowGreen)" filter="url(#blur)"/>

    <circle cx="140" cy="200" r="132" fill="none" stroke="#cba6f7" stroke-width="0.6" opacity="0.2"/>
    <circle cx="140" cy="200" r="102" fill="none" stroke="#b4befe" stroke-width="0.5" opacity="0.12"/>

    <circle cx="730" cy="340" r="70" fill="none" stroke="#a6e3a1" stroke-width="0.6" opacity="0.18"/>
    <circle cx="730" cy="340" r="48" fill="none" stroke="#a6e3a1" stroke-width="0.5" opacity="0.1"/>

    <!-- Terminal card -->
    <rect x="44" y="68" width="262" height="248" rx="12" fill="url(#cardGrad)" stroke="#45475a" stroke-width="1"/>
    <rect x="44" y="68" width="262" height="1.5" rx="1" fill="#cba6f7" opacity="0.7"/>

    <rect x="44" y="68" width="262" height="36" rx="12" fill="#313244"/>
    <rect x="44" y="92" width="262" height="12" fill="#313244"/>

    <circle cx="68" cy="86" r="5.5" fill="#f38ba8"/>
    <circle cx="84" cy="86" r="5.5" fill="#f9e2af"/>
    <circle cx="100" cy="86" r="5.5" fill="#a6e3a1"/>

    <text x="173" y="90" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#6c7086">zsh — opencode</text>

    <line x1="44" y1="104" x2="306" y2="104" stroke="#45475a" stroke-width="1"/>

    <text x="60" y="126" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#cba6f7">&#x276f;</text>
    <text x="74" y="126" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#cdd6f4">obsidian list</text>

    <text x="60" y="144" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#a6e3a1">&#x2713; Demo vault — 142 notes</text>

    <text x="60" y="162" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#45475a">&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;</text>

    <text x="60" y="180" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#cba6f7">&#x276f;</text>
    <text x="74" y="180" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#cdd6f4">opencode</text>

    <text x="60" y="198" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#a6e3a1">&#x2713; obsidian-cli skill loaded</text>
    <text x="60" y="216" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#a6e3a1">&#x2713; WSL bridge active</text>

    <text x="60" y="234" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#45475a">&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;</text>

    <text x="60" y="252" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#cba6f7">&#x276f;</text>
    <text x="74" y="252" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#cdd6f4">skill obsidian-cli <tspan fill="#a6e3a1">&#x2713;</tspan></text>

    <rect x="60" y="264" width="7" height="14" rx="1" fill="#cba6f7" opacity="0.85"/>

    <!-- Bridge connector -->
    <g opacity="0.65">
      <line x1="318" y1="192" x2="362" y2="192" stroke="#b4befe" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="362,188 370,192 362,196" fill="#b4befe"/>
      <circle cx="314" cy="192" r="5" fill="#b4befe" filter="url(#blurXs)"/>
      <circle cx="314" cy="192" r="3" fill="#cba6f7"/>
    </g>

    <!-- Right: badge -->
    <rect x="388" y="72" width="118" height="22" rx="4" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-opacity="0.3" stroke-width="1"/>
    <text x="447" y="87" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cba6f7" letter-spacing="1">&#x26A1; DEV SETUP</text>

    <!-- Main title -->
    <text x="388" y="136" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#cdd6f4" letter-spacing="-0.5">WSL + OpenCode</text>
    <text x="388" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
      <tspan fill="#cdd6f4">+ </tspan><tspan fill="#cba6f7">Obsidian</tspan>
    </text>

    <!-- Subtitle -->
    <text x="388" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#7f849c">AI-powered notes from the terminal</text>

    <!-- Divider -->
    <line x1="388" y1="230" x2="565" y2="230" stroke="#45475a" stroke-width="1"/>

    <!-- Tags -->
    <rect x="388" y="243" width="46" height="22" rx="3" fill="#a6e3a1" fill-opacity="0.1" stroke="#a6e3a1" stroke-opacity="0.35" stroke-width="1"/>
    <text x="411" y="258" text-anchor="middle" font-family="ui-monospace,'SF Mono',monospace" font-size="11" fill="#a6e3a1">WSL2</text>

    <rect x="442" y="243" width="74" height="22" rx="3" fill="#89dceb" fill-opacity="0.1" stroke="#89dceb" stroke-opacity="0.35" stroke-width="1"/>
    <text x="479" y="258" text-anchor="middle" font-family="ui-monospace,'SF Mono',monospace" font-size="11" fill="#89dceb">OpenCode</text>

    <rect x="524" y="243" width="68" height="22" rx="3" fill="#cba6f7" fill-opacity="0.1" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
    <text x="558" y="258" text-anchor="middle" font-family="ui-monospace,'SF Mono',monospace" font-size="11" fill="#cba6f7">Obsidian</text>

    <rect x="600" y="243" width="36" height="22" rx="3" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618" y="258" text-anchor="middle" font-family="ui-monospace,'SF Mono',monospace" font-size="11" fill="#f38ba8">CLI</text>

    <!-- Code snippet card — moved to bottom right, below tags -->
    <rect x="648" y="280" width="130" height="84" rx="8" fill="#181825" stroke="#45475a" stroke-width="1" opacity="0.92"/>
    <rect x="648" y="280" width="130" height="1.5" rx="1" fill="#89dceb" opacity="0.55"/>
    <text x="662" y="299" font-family="ui-monospace,'SF Mono',monospace" font-size="10" fill="#6c7086">~/.zshenv</text>
    <text x="662" y="316" font-family="ui-monospace,'SF Mono',monospace" font-size="10">
      <tspan fill="#cba6f7">obsidian</tspan><tspan fill="#cdd6f4">() {</tspan>
    </text>
    <text x="662" y="332" font-family="ui-monospace,'SF Mono',monospace" font-size="10" fill="#a6e3a1">  powershell.exe \</text>
    <text x="662" y="348" font-family="ui-monospace,'SF Mono',monospace" font-size="10" fill="#f9e2af">    "$@"</text>
    <text x="662" y="364" font-family="ui-monospace,'SF Mono',monospace" font-size="10" fill="#cdd6f4">}</text>

    <!-- Bottom accent line -->
    <rect x="0" y="397" width="800" height="3" fill="url(#accentLine)"/>
  </g>
</svg>
